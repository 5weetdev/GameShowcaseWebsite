        <main>
            <!-- SHOWCASE PROJECT SECTION (REDESIGNED STRUCTURE) -->
            <section id="showcase-project">
                <div class="showcase-header">
                    <h2 id="showcaseTitle" class="section-title"></h2>
                    <div id="showcaseStoreLinks" class="store-links"></div>
                </div>
                <div class="showcase-content-box">
                    <p id="showcaseDescription"></p>
                    <div id="showcaseScreenshots" class="screenshots-container"></div>
                    <div id="showcaseAchievements" class="achievements-list"></div>
                </div>
            </section>

            <section id="featured-projects"><h2 class="section-title" id="featured-title"></h2><p class="nda-tip" id="featured-nda"></p><div class="featured-project-list" id="featured-list"></div></section>
            <section id="hypercasual-games"><h2 class="section-title" id="hypercasual-title"></h2><p id="hypercasual-description" class="section-description"></p><div class="project-grid-hypercasual" id="hypercasual-grid"></div></section>
            <section id="game-jams"><h2 class="section-title" id="gamejams-title"></h2><div class="gamejam-list" id="gamejams-list"></div></section>
            <section id="videos-prototypes"><h2 class="section-title" id="videos-title"></h2><div class="video-grid" id="videos-grid"></div></section>
        </main>

        <footer><p>&copy; 2024 Oleksii Voloshchuk. All rights reserved.</p></footer>
    </div>

    <div id="imageModal" class="image-modal"><span class="modal-close" id="modalClose">&times;</span><img class="modal-content" id="modalImage"></div>

    <script>
        // ... (The initializeImageModal function remains unchanged) ...
        function initializeImageModal() {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const closeBtn = document.getElementById('modalClose');
            
            // Re-query for enlargeable images after they are populated
            const setupEnlargeableImages = () => {
                const enlargeableImages = document.querySelectorAll('.enlargeable');

                if (!modal || !modalImg || !closeBtn) return;

                enlargeableImages.forEach(img => {
                    // If image is inside a link, don't open modal, let the link work
                    if (img.closest('a')) {
                        return;
                    }
                    img.onclick = function() {
                        modal.style.display = "flex";
                        modalImg.src = this.src;
                    }
                });
            };

            const closeModal = () => { modal.style.display = "none"; }
            closeBtn.onclick = closeModal;
            window.addEventListener('click', (event) => { if (event.target == modal) closeModal(); });
            window.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeModal(); });
            
            // Return the function so we can call it after populating the page
            return setupEnlargeableImages;
        }


        document.addEventListener('DOMContentLoaded', () => {
            const setupImages = initializeImageModal();

            fetch('portfolio-data.json')
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    populatePage(data);
                    // Now that the DOM is populated with images, set up the click listeners
                    setupImages();
                })
                .catch(error => console.error("Could not load portfolio data:", error));

            function populatePage(data) {
                // Profile
                document.getElementById('profilePic').src = data.profile.imageUrl;
                document.getElementById('profilePic').alt = `${data.profile.name} Profile Picture`;
                document.getElementById('profileName').textContent = data.profile.name;
                document.getElementById('profileBio').textContent = data.profile.bio;
                data.profile.contacts.forEach(contact => {
                    const link = document.querySelector(`.contact-item[data-contact="${contact.type}"]`);
                    if (link) {
                        link.href = contact.url;
                        link.querySelector('span').textContent = contact.text;
                    }
                });

                // --- Populate Showcase Project ---
                const showcase = data.sections.showcaseProject;
                if (showcase) {
                    document.getElementById('showcaseTitle').textContent = showcase.title;
                    document.getElementById('showcaseDescription').textContent = showcase.description;
                    const storeLinksContainer = document.getElementById('showcaseStoreLinks');
                    storeLinksContainer.innerHTML = ''; // Clear existing
                    showcase.storeLinks.forEach(link => {
                        storeLinksContainer.innerHTML += `
                            <a href="${link.url}" target="_blank" class="store-link">
                                <img src="${link.iconUrl}" alt="${link.platform} logo">
                                <span>${link.platform}</span>
                            </a>`;
                    });
                    const screenshotsContainer = document.getElementById('showcaseScreenshots');
                    screenshotsContainer.innerHTML = ''; // Clear existing
                    showcase.screenshots.forEach(src => {
                        screenshotsContainer.innerHTML += `
                            <div class="screenshot-item">
                                <img src="${src}" alt="Screenshot of ${showcase.title}" class="enlargeable">
                            </div>`;
                    });
                    const achievementsContainer = document.getElementById('showcaseAchievements');
                    achievementsContainer.innerHTML = ''; // Clear existing
                    showcase.achievements.forEach(ach => {
                        achievementsContainer.innerHTML += `
                            <div class="achievement-card">
                                <img src="${ach.iconUrl}" class="achievement-icon" alt="">
                                <div class="achievement-text">
                                    <span class="achievement-title">${ach.title}</span>
                                    <span class="achievement-description">${ach.description}</span>
                                </div>
                            </div>`;
                    });
                }

                // Featured Projects
                const featured = data.sections.featured;
                document.getElementById('featured-title').textContent = featured.title;
                document.getElementById('featured-nda').textContent = featured.ndaNote;
                const featuredList = document.getElementById('featured-list');
                featuredList.innerHTML = ''; // Clear existing
                featured.projects.forEach(p => {
                    const titleHTML = p.url ? `<a href="${p.url}" target="_blank">${p.title}</a>` : p.title;
                    let mediaHTML = '';
                    if (p.youtubeEmbedUrl) {
                        mediaHTML = `<iframe src="${p.youtubeEmbedUrl}" title="${p.title} Video" allowfullscreen></iframe>`;
                    } else if (p.image) {
                        mediaHTML = `<img src="${p.image}" alt="${p.title} Screenshot" class="enlargeable">`;
                    }
                    featuredList.innerHTML += `
                        <div class="featured-card">
                            <div class="featured-card-media">${mediaHTML}</div>
                            <div class="featured-card-content">
                                <h3>${titleHTML}</h3>
                                <p>${p.description}</p>
                            </div>
                        </div>`;
                });

                // Hypercasual Games
                const hypercasual = data.sections.hypercasual;
                document.getElementById('hypercasual-title').textContent = hypercasual.title;
                document.getElementById('hypercasual-description').textContent = hypercasual.description; // Populate new description
                const hypercasualGrid = document.getElementById('hypercasual-grid');
                hypercasualGrid.innerHTML = ''; // Clear existing
                hypercasual.projects.forEach(p => {
                    const cardContent = `
                        <img src="${p.image}" alt="${p.title}" class="enlargeable">
                        <h4>${p.title}</h4>
                    `;
                    if (p.url) {
                        hypercasualGrid.innerHTML += `<a href="${p.url}" target="_blank" class="hypercasual-card is-clickable">${cardContent}</a>`;
                    } else {
                        hypercasualGrid.innerHTML += `<div class="hypercasual-card">${cardContent}</div>`;
                    }
                });

                // Game Jams
                const gameJams = data.sections.gameJams;
                document.getElementById('gamejams-title').textContent = gameJams.title;
                const gameJamsList = document.getElementById('gamejams-list');
                gameJamsList.innerHTML = ''; // Clear existing
                gameJams.projects.forEach(p => {
                    const linksHTML = p.links.map(link => `<a href="${link.url}" target="_blank" title="${link.title}"><img src="${link.icon}" class="href-icon" alt="${link.title}"/></a>`).join('');
                    const platformsHTML = p.platforms.map(platform => `<img src="${platform.icon}" class="icon" title="${platform.title}" alt="${platform.title}"/>`).join('');
                    const titleHTML = p.url ? `<a href="${p.url}" target="_blank">${p.title}</a>` : p.title;
                    gameJamsList.innerHTML += `<div class="gamejam-item"><div class="gamejam-info"><div class="row-container"><h3>${titleHTML}</h3><div class="links">${linksHTML}</div></div><p>${p.description}</p><div class="platforms">${platformsHTML}</div></div><div class="gamejam-visual"><img src="${p.image}" alt="${p.title} Screenshot" class="enlargeable"></div></div>`;
                });

                // Videos & Prototypes
                const videos = data.sections.videos;
                document.getElementById('videos-title').textContent = videos.title;
                const videosGrid = document.getElementById('videos-grid');
                videosGrid.innerHTML = ''; // Clear existing
                videos.projects.forEach(p => {
                    videosGrid.innerHTML += `<div class="video-card"><h3>${p.title}</h3><iframe src="${p.youtubeEmbedUrl}" title="YouTube video player" allowfullscreen></iframe><p>${p.description}</p</div>`;
                });
            }
        });
    </script>
